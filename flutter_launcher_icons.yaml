# Launcher icon generation: dart run flutter_launcher_icons
# Source art is generated (tool/make_icon.py): soil brown #6B4F2A,
# a gambrel barn over a wrench at the fence line.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#6B4F2A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 26
